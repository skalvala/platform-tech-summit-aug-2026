      <text x="664" y="468" text-anchor="middle" class="b-label" font-size="17">Ajna</text>
    </g>

    <!-- Ajna -> Beacon -->
    <path class="edge flow stream" d="M724,440 L800,440 L800,414 L884,414" marker-end="url(#arrowCyan)"/>
    <text class="flow-label" x="742" y="392" fill="#0e7490" font-size="12">Traces · Error Logs</text>
    <text class="flow-label" x="742" y="408" fill="#b45309" font-size="11.5" font-style="italic">Metrics — planned</text>

    <!-- Ajna -> S3 -->
