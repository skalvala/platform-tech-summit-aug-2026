    <text class="flow-label" x="676" y="560" fill="#b45309" font-size="12">Info Logs</text>

    <!-- Amazon S3 -->
    <g class="shadow">
      <path d="M614,614 h100 l-10,74 a40,9 0 0 1 -80,0 Z" fill="#7cb342" stroke="#5f8f2f" stroke-width="1.4"/>
      <ellipse cx="664" cy="614" rx="50" ry="9" fill="#8bc34a" stroke="#5f8f2f" stroke-width="1.4"/>
      <text x="664" y="726" text-anchor="middle" class="b-label" font-size="13" fill="#4a6320">Amazon S3</text>
    </g>

    <!-- Beacon -->
    <g class="shadow">
