<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Unified Observability for Traces — High-Level Architecture with Batch">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64789e"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f9d6a"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arrowFeed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64789e"/></marker>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4faea"/><stop offset="1" stop-color="#cdefd8"/></linearGradient>
    <linearGradient id="gSticky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe07a"/><stop offset="1" stop-color="#ffcf3f"/></linearGradient>
    <linearGradient id="gStore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <linearGradient id="gLake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe9ff"/><stop offset="1" stop-color="#c2d6f5"/></linearGradient>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a2233"/><stop offset="1" stop-color="#3a4a66"/></linearGradient>
    <radialGradient id="gGlowC" cx="80%" cy="2%" r="60%"><stop offset="0" stop-color="#0891b2" stop-opacity="0.06"/><stop offset="0.7" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <radialGradient id="gGlowV" cx="6%" cy="6%" r="45%"><stop offset="0" stop-color="#6d28d9" stop-opacity="0.05"/><stop offset="0.7" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
    <style>
      .b-label { font-weight:700; }
      .flow-label { font-family:"Courier New", monospace; paint-order:stroke; stroke:#ffffff; stroke-width:3.4px; stroke-linejoin:round; }
      .edge { fill:none; stroke-width:2.6; }
      .feed { stroke:#64789e; stroke-width:2.4; }
      .tel { stroke:#0f9d6a; } .stream { stroke:#0891b2; } .batch { stroke:#b45309; } .bidi { stroke:#6d28d9; }
      .flow { stroke-dasharray:10 10; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-20; } }
      .shadow { filter: drop-shadow(0 6px 14px rgba(20,30,60,.16)); }
    </style>
  </defs>

  <!-- Backdrop -->
  <rect x="0" y="0" width="2000" height="1320" rx="26" fill="#ffffff"/>
  <rect x="0" y="0" width="2000" height="1320" rx="26" fill="url(#gGlowC)"/>
  <rect x="0" y="0" width="2000" height="1320" rx="26" fill="url(#gGlowV)"/>
  <rect x="6" y="6" width="1988" height="1308" rx="22" fill="none" stroke="#dbe2ee" stroke-width="1.5"/>

  <!-- Header -->
  <text x="70" y="70" font-family="Courier New, monospace" font-size="17" letter-spacing="5" fill="#0891b2">PLATFORM TECH SUMMIT · AUG 2026 · HIGH-LEVEL DESIGN</text>
  <text x="68" y="128" font-size="46" font-weight="800" fill="url(#gHead)">Unified Observability for Traces</text>
  <text x="68" y="176" font-size="30" font-weight="800" fill="#b45309">High-Level Architecture · with Batch</text>
  <text x="1930" y="150" text-anchor="end" font-size="17" font-weight="700" fill="#0e7490">Live today: Traces &amp; Error Logs</text>
  <text x="1930" y="176" text-anchor="end" font-size="15" fill="#b45309">Metrics — planned future work</text>

  <!-- Legend -->
  <g font-size="18" transform="translate(70,214)">
    <rect x="0" y="-14" width="30" height="16" rx="4" fill="#d6f5df" stroke="#3fb765"/><text x="40" y="0" fill="#5b6678">Service / Compute</text>
    <rect x="255" y="-14" width="30" height="16" rx="4" fill="#eef3fb" stroke="#c3d0e6"/><text x="295" y="0" fill="#5b6678">Store / Sink</text>
    <line x1="485" y1="-6" x2="525" y2="-6" stroke="#0f9d6a" stroke-width="4" stroke-dasharray="10 8"/><text x="535" y="0" fill="#5b6678">Telemetry ingest</text>
    <line x1="745" y1="-6" x2="785" y2="-6" stroke="#0891b2" stroke-width="4" stroke-dasharray="10 8"/><text x="795" y="0" fill="#5b6678">Real-time / streaming</text>
    <line x1="1020" y1="-6" x2="1060" y2="-6" stroke="#b45309" stroke-width="4" stroke-dasharray="10 8"/><text x="1070" y="0" fill="#5b6678">Planned: Batch (S3 → Spark)</text>
    <line x1="1425" y1="-6" x2="1465" y2="-6" stroke="#6d28d9" stroke-width="4" stroke-dasharray="10 8"/><text x="1475" y="0" fill="#5b6678">Query experience layer</text>
  </g>

  <!-- ============ DIAGRAM ============ -->
  <g transform="translate(100,250)" fill="#10203a">

    <!-- Boundaries -->
    <!-- Falcon Instance 1 (outer): Instrumentation + Ingestion Platform -->
    <rect x="48" y="150" width="754" height="712" rx="18" fill="rgba(109,40,217,.045)" stroke="#8b73c4" stroke-width="1.8" stroke-dasharray="7 6"/>
    <text class="b-label" x="191" y="182" text-anchor="middle" fill="#6d28d9" font-size="20" font-weight="800">Falcon Instance 1</text>

    <!-- Instrumentation (wraps Core FD + Near Core Services) -->
    <rect x="60" y="214" width="264" height="632" rx="14" fill="rgba(51,78,104,.05)" stroke="#5b7089" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text class="b-label" x="191" y="240" text-anchor="middle" fill="#334e68" font-size="18" font-weight="800">Instrumentation</text>
    <text x="191" y="260" text-anchor="middle" fill="#8a94a6" font-size="12" font-style="italic">(VERTICAL #1)</text>

    <!-- Falcon Instance 2 (outer): Data Cloud + Consumption -->
    <rect x="814" y="150" width="956" height="712" rx="18" fill="rgba(109,40,217,.045)" stroke="#8b73c4" stroke-width="1.8" stroke-dasharray="7 6"/>
    <text class="b-label" x="1750" y="184" text-anchor="end" fill="#6d28d9" font-size="24" font-weight="800">Falcon Instance 2</text>

    <!-- CDP FD (Falcon Instance 1 side): wraps Ingestion Platform -->
    <rect x="360" y="212" width="432" height="626" rx="16" fill="rgba(51,78,104,.055)" stroke="#5b7089" stroke-width="1.6" stroke-dasharray="7 6"/>
    <text class="b-label" x="576" y="242" text-anchor="middle" fill="#334e68" font-size="22" font-weight="800">CDP FD</text>
    <!-- CDP FD (Falcon Instance 2 side): wraps Data Cloud -->
    <rect x="824" y="212" width="744" height="626" rx="16" fill="rgba(51,78,104,.055)" stroke="#5b7089" stroke-width="1.6" stroke-dasharray="7 6"/>
    <text class="b-label" x="1196" y="242" text-anchor="middle" fill="#334e68" font-size="22" font-weight="800">CDP FD</text>

    <rect x="372" y="258" width="404" height="562" rx="14" fill="rgba(8,145,178,.05)" stroke="#4a7f97" stroke-width="1.6" stroke-dasharray="7 6"/>
    <text class="b-label" x="574" y="292" text-anchor="middle" fill="#0e7490" font-size="21">Ingestion Platform</text>
    <text x="574" y="312" text-anchor="middle" fill="#6a7893" font-size="12" font-style="italic">(VERTICAL #2)</text>

    <rect x="836" y="258" width="720" height="562" rx="14" fill="rgba(8,145,178,.04)" stroke="#4a7f97" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text class="b-label" x="1196" y="292" text-anchor="middle" fill="#0e7490" font-size="19">Data Cloud</text>
    <text x="1196" y="312" text-anchor="middle" fill="#6a7893" font-size="12" font-style="italic">(VERTICAL #3)</text>

    <rect x="1320" y="330" width="196" height="470" rx="12" fill="rgba(71,96,137,.07)" stroke="#476089" stroke-width="1.4" stroke-dasharray="6 6"/>
    <text class="b-label" x="1418" y="362" text-anchor="middle" fill="#3a5878" font-size="18">Lakehouse</text>

    <rect x="1572" y="330" width="176" height="470" rx="12" fill="rgba(109,40,217,.05)" stroke="#8b73c4" stroke-width="1.4" stroke-dasharray="6 6"/>
    <text class="b-label" x="1660" y="362" text-anchor="middle" fill="#6d28d9" font-size="16">Consumption Layer</text>
    <text x="1660" y="382" text-anchor="middle" fill="#6a7893" font-size="11" font-style="italic">(VERTICAL #4)</text>

    <rect x="70" y="560" width="232" height="272" rx="12" fill="rgba(15,157,106,.06)" stroke="#3f7a56" stroke-width="1.4" stroke-dasharray="6 6"/>
    <text class="b-label" x="186" y="592" text-anchor="middle" fill="#0f9d6a" font-size="15">Near Core Services</text>

    <!-- (sticky-note actors and their feed arrows removed) -->

    <!-- Core -->
    <g class="shadow">
      <rect x="70" y="318" width="232" height="212" rx="10" fill="#ffffff" stroke="#c3d0e6" stroke-width="1.5"/>
      <text x="186" y="346" text-anchor="middle" class="b-label" font-size="16">Core FD</text>
      <g font-size="13" text-anchor="middle">
        <rect x="96" y="360" width="180" height="30" rx="7" fill="#f4f7fc" stroke="#c9d5ea"/><text x="186" y="380">Flow</text>
        <rect x="96" y="398" width="180" height="30" rx="7" fill="#f4f7fc" stroke="#c9d5ea"/><text x="186" y="418">APEX</text>
        <rect x="96" y="436" width="180" height="30" rx="7" fill="#f4f7fc" stroke="#c9d5ea"/><text x="186" y="456">Prompt Builder</text>
        <rect x="96" y="474" width="180" height="30" rx="7" fill="#f4f7fc" stroke="#c9d5ea"/><text x="186" y="497" font-weight="700" letter-spacing="2">· · · · ·</text>
      </g>
    </g>
    <path class="edge" style="stroke:#0f9d6a;stroke-width:2.6" d="M14,406 L70,406" marker-end="url(#arrowGreen)"/>

    <!-- Near Core rows -->
    <g font-size="13" text-anchor="middle">
      <rect x="92" y="606" width="188" height="34" rx="7" fill="#ffffff" stroke="#c9d5ea"/><text x="186" y="628">DC Services</text>
      <rect x="92" y="650" width="188" height="34" rx="7" fill="#ffffff" stroke="#c9d5ea"/><text x="186" y="672">Planner Service</text>
      <rect x="92" y="694" width="188" height="34" rx="7" fill="#ffffff" stroke="#c9d5ea"/><text x="186" y="716">LLMG Service</text>
      <rect x="92" y="738" width="188" height="34" rx="7" fill="#ffffff" stroke="#c9d5ea"/><text x="186" y="760">MCP</text>
    </g>

    <!-- Telemetry merge -->
    <path class="edge flow tel" d="M302,424 L338,424 L338,466"/>
    <path class="edge flow tel" d="M302,672 L338,672 L338,466"/>
    <path class="edge flow tel" d="M338,466 L406,466" marker-end="url(#arrowGreen)"/>
    <text class="flow-label" x="350" y="500" fill="#0f9d6a" font-size="12">Customer-facing</text>
    <text class="flow-label" x="350" y="516" fill="#0f9d6a" font-size="12">Telemetry Data</text>

    <!-- Ingestion Service -->
    <g class="shadow">
      <path d="M410,428 L516,428 L463,520 Z" fill="url(#gGreen)" stroke="#3fb765" stroke-width="1.6"/>
      <text x="463" y="462" text-anchor="middle" class="b-label" font-size="13">Ingestion</text>
      <text x="463" y="480" text-anchor="middle" font-size="12">Service</text>
    </g>
    <path class="edge flow tel" d="M516,455 L604,455" marker-end="url(#arrowGreen)"/>

    <!-- Ajna -->
    <g class="shadow">
