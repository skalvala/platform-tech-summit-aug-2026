      <text x="947" y="421" text-anchor="middle" class="b-label" font-size="16">Beacon</text>
    </g>
    <path class="edge flow stream" d="M947,448 L947,520" marker-end="url(#arrowCyan)"/>

    <!-- Ajna Topics -->
    <g class="shadow">
      <path d="M892,532 h110 v74 a55,12 0 0 1 -110,0 Z" fill="url(#gGreen)" stroke="#3fb765" stroke-width="1.5"/>
      <ellipse cx="947" cy="532" rx="55" ry="12" fill="#e4faea" stroke="#3fb765" stroke-width="1.5"/>
      <text x="947" y="566" text-anchor="middle" font-size="11.5" font-weight="700">Ajna Topics</text>
      <text x="947" y="582" text-anchor="middle" font-size="10">sharded by</text>
      <text x="947" y="596" text-anchor="middle" font-size="10">CDP Tenants</text>
    </g>
    <path class="edge flow stream" d="M1002,556 L1044,556 L1044,470" marker-end="url(#arrowCyan)"/>

    <!-- Streaming connector -->
    <g class="shadow">
      <rect x="1058" y="356" width="150" height="104" rx="10" fill="#bfe9cb" stroke="#3fb765"/>
      <rect x="1050" y="364" width="150" height="104" rx="10" fill="#cdefd8" stroke="#3fb765"/>
      <rect x="1042" y="372" width="150" height="104" rx="10" fill="url(#gGreen)" stroke="#3fb765" stroke-width="1.6"/>
      <text x="1117" y="404" text-anchor="middle" font-size="11.5" font-weight="700">Observability</text>
      <text x="1117" y="422" text-anchor="middle" font-size="11.5" font-weight="700">Multi-Tenant</text>
      <text x="1117" y="440" text-anchor="middle" font-size="11">Streaming</text>
      <text x="1117" y="456" text-anchor="middle" font-size="11">connector</text>
    </g>
    <path class="edge flow stream" d="M1192,424 L1320,424" marker-end="url(#arrowCyan)"/>
    <text class="flow-label" x="1210" y="412" fill="#0e7490" font-size="11.5">Fanout Data Writes</text>

    <!-- Spark job -->
    <g class="shadow">
      <rect x="1058" y="612" width="150" height="104" rx="10" fill="#bfe9cb" stroke="#3fb765"/>
      <rect x="1050" y="620" width="150" height="104" rx="10" fill="#cdefd8" stroke="#3fb765"/>
      <rect x="1042" y="628" width="150" height="104" rx="10" fill="url(#gGreen)" stroke="#3fb765" stroke-width="1.6"/>
      <text x="1117" y="668" text-anchor="middle" font-size="11.5" font-weight="700">Single-Tenant</text>
      <text x="1117" y="686" text-anchor="middle" font-size="11.5" font-weight="700">S3 Spark job</text>
    </g>
    <path class="edge flow batch" d="M709,655 L1042,655" marker-end="url(#arrowAmber)"/>
    <text class="flow-label" x="812" y="645" fill="#b45309" font-size="11.5">Read logs from S3</text>
    <path class="edge flow batch" d="M1192,652 L1260,652 L1260,700 L1320,700" marker-end="url(#arrowAmber)"/>

    <!-- Lakehouse cylinders -->
    <g class="shadow">
      <path d="M1348,388 h140 v40 a70,10 0 0 1 -140,0 Z" fill="url(#gLake)" stroke="#476089"/>
      <ellipse cx="1418" cy="388" rx="70" ry="10" fill="#e6f0ff" stroke="#476089"/>
      <text x="1418" y="416" text-anchor="middle" font-size="12" font-weight="700">Data Cloud Tenant1</text>
      <path d="M1348,470 h140 v40 a70,10 0 0 1 -140,0 Z" fill="url(#gLake)" stroke="#476089"/>
      <ellipse cx="1418" cy="470" rx="70" ry="10" fill="#e6f0ff" stroke="#476089"/>
      <text x="1418" y="498" text-anchor="middle" font-size="12" font-weight="700">Data Cloud Tenant2</text>
      <text x="1418" y="566" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2">· · · · ·</text>
      <path d="M1348,614 h140 v40 a70,10 0 0 1 -140,0 Z" fill="url(#gLake)" stroke="#476089"/>
      <ellipse cx="1418" cy="614" rx="70" ry="10" fill="#e6f0ff" stroke="#476089"/>
      <text x="1418" y="642" text-anchor="middle" font-size="12" font-weight="700">Data Cloud TenantN</text>
    </g>

    <!-- Lakehouse <-> Consumption -->
    <path class="edge flow bidi" d="M1516,556 L1572,556" marker-start="url(#arrowViolet)" marker-end="url(#arrowViolet)"/>

    <!-- Consumption -->
    <g class="shadow">
      <polygon points="1600,410 1730,410 1712,478 1582,478" fill="url(#gStore)" stroke="#c3d0e6" stroke-width="1.5"/>
      <text x="1656" y="440" text-anchor="middle" font-size="12" font-weight="700">Unified</text>
      <text x="1656" y="458" text-anchor="middle" font-size="12" font-weight="700">Observability</text>
      <polygon points="1600,600 1730,600 1712,668 1582,668" fill="url(#gStore)" stroke="#c3d0e6" stroke-width="1.5"/>
      <text x="1656" y="630" text-anchor="middle" font-size="12" font-weight="700">headless</text>
    </g>

  </g>

  <!-- Footer -->
  <text x="70" y="1285" font-family="Courier New, monospace" font-size="15" fill="#5b6678">Rendered from “Unified Observability for Traces — High-Level with Batch”  ·  Platform Tech Summit · August 2026</text>
</svg>
