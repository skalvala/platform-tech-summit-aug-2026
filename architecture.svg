    <rect x="812" y="196" width="948" height="700" rx="16" fill="rgba(109,40,217,.045)" stroke="#8b73c4" stroke-width="1.8" stroke-dasharray="7 6"/>
    <text class="b-label" x="1740" y="232" text-anchor="end" fill="#6d28d9" font-size="24" font-weight="800">Falcon Instance</text>

