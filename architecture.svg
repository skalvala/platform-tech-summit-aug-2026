<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Unified Observability for Traces — High-Level Architecture with Batch">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64789e"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f9d6a"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arrowFeed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64789e"/></marker>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4faea"/><stop offset="1" stop-color="#cdefd8"/></linearGradient>
    <linearGradient id="gSticky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe07a"/><stop offset="1" stop-color="#ffcf3f"/></linearGradient>
    <linearGradient id="gStore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <linearGradient id="gLake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe9ff"/><stop offset="1" stop-color="#c2d6f5"/></linearGradient>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a2233"/><stop offset="1" stop-color="#3a4a66"/></linearGradient>
    <radialGradient id="gGlowC" cx="80%" cy="2%" r="60%"><stop offset="0" stop-color="#0891b2" stop-opacity="0.06"/><stop offset="0.7" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <radialGradient id="gGlowV" cx="6%" cy="6%" r="45%"><stop offset="0" stop-color="#6d28d9" stop-opacity="0.05"/><stop offset="0.7" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
    <style>
      .b-label { font-weight:700; }
      .flow-label { font-family:"Courier New", monospace; }
      .edge { fill:none; stroke-width:2.6; }
      .feed { stroke:#64789e; stroke-width:2.4; }
      .tel { stroke:#0f9d6a; } .stream { stroke:#0891b2; } .batch { stroke:#b45309; } .bidi { stroke:#6d28d9; }
      .flow { stroke-dasharray:10 10; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-20; } }
      .shadow { filter: drop-shadow(0 6px 14px rgba(20,30,60,.16)); }
    </style>
  </defs>

  <!-- Backdrop -->
  <rect x="0" y="0" width="2000" height="1320" rx="26" fill="#ffffff"/>
  <rect x="0" y="0" width="2000" height="1320" rx="26" fill="url(#gGlowC)"/>
  <rect x="0" y="0" width="2000" height="1320" rx="26" fill="url(#gGlowV)"/>
  <rect x="6" y="6" width="1988" height="1308" rx="22" fill="none" stroke="#dbe2ee" stroke-width="1.5"/>

  <!-- Header -->
