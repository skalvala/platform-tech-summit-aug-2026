      <polygon points="1600,600 1730,600 1712,668 1582,668" fill="url(#gStore)" stroke="#c3d0e6" stroke-width="1.5"/>
      <text x="1656" y="630" text-anchor="middle" font-size="12" font-weight="700">Concierge</text>
