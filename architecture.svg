    <rect x="215" y="-14" width="30" height="16" rx="4" fill="#d6f5df" stroke="#3fb765"/><text x="255" y="0" fill="#5b6678">Service / Compute</text>
    <rect x="470" y="-14" width="30" height="16" rx="4" fill="#eef3fb" stroke="#c3d0e6"/><text x="510" y="0" fill="#5b6678">Store / Sink</text>
    <line x1="700" y1="-6" x2="740" y2="-6" stroke="#0f9d6a" stroke-width="4" stroke-dasharray="10 8"/><text x="750" y="0" fill="#5b6678">Telemetry ingest</text>
    <line x1="960" y1="-6" x2="1000" y2="-6" stroke="#0891b2" stroke-width="4" stroke-dasharray="10 8"/><text x="1010" y="0" fill="#5b6678">Real-time / streaming</text>
    <line x1="1280" y1="-6" x2="1320" y2="-6" stroke="#b45309" stroke-width="4" stroke-dasharray="10 8"/><text x="1330" y="0" fill="#5b6678">Batch (S3 → Spark)</text>
    <line x1="1560" y1="-6" x2="1600" y2="-6" stroke="#6d28d9" stroke-width="4" stroke-dasharray="10 8"/><text x="1610" y="0" fill="#5b6678">Query / consume</text>
  </g>

