      <path d="M1348,614 h140 v40 a70,10 0 0 1 -140,0 Z" fill="url(#gLake)" stroke="#476089"/>
      <ellipse cx="1418" cy="614" rx="70" ry="10" fill="#e6f0ff" stroke="#476089"/>
      <text x="1418" y="642" text-anchor="middle" font-size="12" font-weight="700">Data Cloud Tn</text>
