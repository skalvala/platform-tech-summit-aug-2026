      <rect x="1050" y="364" width="150" height="104" rx="10" fill="#cdefd8" stroke="#3fb765"/>
      <rect x="1042" y="372" width="150" height="104" rx="10" fill="url(#gGreen)" stroke="#3fb765" stroke-width="1.6"/>
      <text x="1117" y="404" text-anchor="middle" font-size="11.5" font-weight="700">Observability</text>
      <text x="1117" y="422" text-anchor="middle" font-size="11.5" font-weight="700">Multi-Tenant</text>
      <text x="1117" y="440" text-anchor="middle" font-size="11">Streaming</text>
      <text x="1117" y="456" text-anchor="middle" font-size="11">connector</text>
    </g>
